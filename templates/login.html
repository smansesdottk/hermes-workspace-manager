{% extends "base.html" %}
{% block body %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand-mark"><svg viewBox="0 0 32 32" style="width:24px;height:24px;fill:#fff"><path d="M7 24L7 8L12 8L16 15L20 8L25 8L25 24L21.5 24L21.5 13.5L17.5 20L14.5 20L10.5 13.5L10.5 24Z"/></svg></div>
    <h1>MyHermes</h1>
    <p class="kv">Panel manajemen instance Hermes + 9Router.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="fld">Username
        <input name="username" autocomplete="username" required autofocus placeholder="admin">
      </label>
      <label class="fld">Password
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </label>
      <button style="width:100%">Masuk</button>
    </form>
    <div style="margin-top:16px;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px dashed var(--bdr);border-radius:6px;font-size:11.5px;color:var(--muted);text-align:left;line-height:1.5">
      💡 <b>Instalasi Baru?</b><br>
      Gunakan akun bawaan: Username <code>admin</code> · Password <code>admin123</code><br>
      <span style="opacity:0.8">(Dapat diganti kapan saja setelah login)</span>
    </div>
  </div>
</div>

{% endblock %}
